name: 🍎 macOS Builds
on:
  workflow_call:
    inputs:
      run-metal-rt:
        description: Run the self-hosted Apple Silicon Metal RT validation lane.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run-metal-rt:
        description: Run the self-hosted Apple Silicon Metal RT validation lane.
        required: false
        default: false
        type: boolean

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: macos-editor
            target: editor
            bin: ./bin/godot.macos.editor.universal

          - name: Template (target=template_release)
            cache-name: macos-template
            target: template_release
            scons-flags: debug_symbols=no
            bin: ./bin/godot.macos.template_release.universal

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        id: accesskit-download
        uses: ./.github/actions/fetch-gh-release-asset
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.1
          file: accesskit-c-0.21.1.zip
          target: accesskit-c-0.21.1/accesskit_c.zip
        continue-on-error: true

      - name: Extract pre-built AccessKit
        if: steps.accesskit-download.outcome == 'success'
        run: unzip -o accesskit-c-0.21.1/accesskit_c.zip

      - name: Set AccessKit enabled
        id: accesskit-sdk
        run: |
          if [ "${{ steps.accesskit-download.outcome }}" = "success" ]; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK download failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          lipo -create ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64 -output ./bin/godot.macos.${{ matrix.target }}.universal
          rm ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors

  # Metal-only lane: proves the arm64 editor builds, boots, and passes unit
  # tests with the Metal rendering driver as the only native backend, i.e.
  # without the Vulkan/MoltenVK, ANGLE, or AccessKit fallbacks the main lane
  # installs opportunistically. See docs/rt_metal_port/build_lane.md.
  build-macos-metal-only:
    runs-on: macos-26
    name: Editor Metal-only (target=editor, arch=arm64, vulkan=no, angle=no)
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: macos-editor-metal-only
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation (arm64, Metal only)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 metal=yes vulkan=no angle=no accesskit=no
          platform: macos
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: macos-editor-metal-only
        continue-on-error: true

      - name: Prepare artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-editor-metal-only

      - name: Smoke and unit tests
        run: |
          set -o pipefail
          mkdir -p metal-only-logs
          ./bin/godot.macos.editor.arm64 --version 2>&1 | tee metal-only-logs/01-version.log
          ./bin/godot.macos.editor.arm64 --help 2>&1 | tee metal-only-logs/02-help.log
          ./bin/godot.macos.editor.arm64 --test --force-colors 2>&1 | tee metal-only-logs/03-unit-tests.log

      - name: Upload test logs
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-editor-metal-only-logs
          path: metal-only-logs/*

  # Native Metal RT behavior must run on a persistent Apple Silicon GPU. The
  # custom `metal-rt` label is the capability label: repositories opt in with
  # the ENABLE_METAL_RT_CI variable after registering a matching runner. A
  # manual dispatch can also opt in explicitly with the workflow input.
  test-metal-rt:
    if: vars.ENABLE_METAL_RT_CI == 'true' || inputs.run-metal-rt
    needs: build-macos-metal-only
    runs-on: [self-hosted, macOS, ARM64, metal-rt]
    name: Metal RT render validation (self-hosted Apple Silicon)
    timeout-minutes: 30
    concurrency:
      group: metal-rt-apple-silicon
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Metal-only editor
        uses: ./.github/actions/download-artifact
        with:
          name: macos-editor-metal-only
          path: bin

      - name: Validate runner and binary architecture
        env:
          GODOT_RUNNER_ARCH: ${{ runner.arch }}
          GODOT_RUNNER_OS: ${{ runner.os }}
        run: |
          if [[ "$GODOT_RUNNER_OS" != "macOS" || "$GODOT_RUNNER_ARCH" != "ARM64" ]]; then
            echo "Expected a macOS ARM64 runner, got $GODOT_RUNNER_OS $GODOT_RUNNER_ARCH" >&2
            exit 1
          fi
          chmod +x bin/godot.macos.editor.arm64
          lipo -verify_arch arm64 bin/godot.macos.editor.arm64

      - name: Run capability, GPU, image, traversal parity, and fallback validation
        env:
          MTL_DEBUG_LAYER: 1
        run: |
          python3 tests/metal_rt/run_mac_rt_tests.py \
            --stage gpu \
            --stage image \
            --stage intersector-parity \
            --stage fallback \
            --binary bin/godot.macos.editor.arm64 \
            --artifact-dir metal-rt-artifacts \
            --fail-on-skip \
            --keep-going

      - name: Upload Metal RT validation artifacts
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-metal-rt-validation
          path: metal-rt-artifacts/**
